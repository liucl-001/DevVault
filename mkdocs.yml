site_name: DevVault
site_description: 技术文章与工程笔记
site_author: liucl

docs_dir: mkdocs-docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

nav:
  - 首页: index.md
  - C++工程化实战:
      - 导读: cpp-engineering/index.md
      - 01 工具链与vcpkg: cpp-engineering/01-toolchain.md
      - 02 Docker环境: cpp-engineering/02-docker.md
      - 03 Jenkins主节点: cpp-engineering/03-jenkins-master.md
      - 04 三平台从节点: cpp-engineering/04-jenkins-agents.md
      - 05 最小CMake工程: cpp-engineering/05-min-cmake.md
      - 06 CMake并发编译: cpp-engineering/06-parallel.md
      - 07 多平台并行构建: cpp-engineering/07-matrix.md
      - 08 依赖缓存与增量: cpp-engineering/08-cache.md
      - 09 Pipeline语法: cpp-engineering/09-pipeline.md
      - 10 C++流水线实战: cpp-engineering/10-pipeline-real.md
  - 低延迟桌面串流全栈实战:
      - 导读: streaming/guide.md
      - 01 系统总览与架构: streaming/01-architecture.md
      - 02 FFmpeg 基础: streaming/02-ffmpeg-basics.md
      - 03 屏幕采集: streaming/03-capture-interface.md
      - 04 采集自动降级链: streaming/04-capture-degrade.md
      - 05 硬件编码接入 FFmpeg: streaming/05-hw-encode.md
      - 06 RTP 推流与 RTCP 反馈: streaming/06-rtp.md
      - 07 私有控制面与自定义 SEI: streaming/07-control-sei.md
      - 08 RTP 接收与硬件解码: streaming/08-receive-decode.md
      - 09 SDL 上屏与 Qt 嵌入: streaming/09-sdl-qt.md
      - 10 采集端状态机与延迟控制: streaming/10-state-latency.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: ja
