site_name: DevVault
site_description: 技术文章与工程笔记
site_author: liucl

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

nav:
  - 首页: index.md
  - C++工程化实战:
      - 导读: cpp-engineering/index.md
      - 01 工具链与vcpkg: cpp-engineering/01-toolchain.md
      - 02 Docker环境: cpp-engineering/02-docker.md
      - 03 Jenkins主节点: cpp-engineering/03-jenkins-master.md
      - 04 三平台从节点: cpp-engineering/04-jenkins-agents.md
      - 05 最小CMake工程: cpp-engineering/05-min-cmake.md
      - 06 CMake并发编译: cpp-engineering/06-parallel.md
      - 07 多平台并行构建: cpp-engineering/07-matrix.md
      - 08 依赖缓存与增量: cpp-engineering/08-cache.md
      - 09 Pipeline语法: cpp-engineering/09-pipeline.md
      - 10 C++流水线实战: cpp-engineering/10-pipeline-real.md
  - 低延迟桌面串流:
      - 导读(术语表): desktop-streaming/index.md
      - 01 系统总览与架构: desktop-streaming/01-系统总览与架构.md
      - 02 FFmpeg 基础: desktop-streaming/02-FFmpeg基础.md
      - 03 屏幕采集接口: desktop-streaming/03-屏幕采集接口与两种后端.md
      - 04 采集自动降级链: desktop-streaming/04-采集自动降级链.md
      - 05 硬件编码接入FFmpeg: desktop-streaming/05-硬件编码接入FFmpeg.md
      - 06 RTP推流与RTCP反馈: desktop-streaming/06-RTP推流与RTCP反馈.md
      - 07 私有控制面与自定义SEI: desktop-streaming/07-私有控制面与自定义SEI.md
      - 08 RTP接收与硬件解码: desktop-streaming/08-RTP接收与硬件解码.md
      - 09 SDL上屏与Qt嵌入: desktop-streaming/09-SDL上屏与Qt嵌入.md
      - 10 采集端状态机与延迟控制: desktop-streaming/10-采集端状态机与延迟控制.md
  - Java Agent与字节码改写: java-agent-bytecode.md
  - OpenPlugins插件化架构:
      - 导读: open-plugins/index.md
      - 01 项目定位与全景: open-plugins/01-项目定位与全景.md
      - 02 架构分层: open-plugins/02-架构分层.md
      - 03 插件契约: open-plugins/03-插件契约.md
      - 04 加载与生命周期: open-plugins/04-加载与生命周期.md
      - 05 依赖解析: open-plugins/05-依赖解析.md
      - 06 函数路由与内存流通信: open-plugins/06-函数路由与内存流通信.md
      - 07 序列化机制: open-plugins/07-序列化机制.md
      - 08 插件包与安全: open-plugins/08-插件包与安全.md
      - 09 WebView与WebAPI: open-plugins/09-WebView与WebAPI.md
      - 10 配套工程体系: open-plugins/10-配套工程体系.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: ja
