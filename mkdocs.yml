site_name: DevVault
site_description: 技术文章与工程笔记
site_author: liucl

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

nav:
  - 首页: index.md
  - C++工程化实战:
      - 导读: cpp-engineering/index.md
      - 01 工具链与vcpkg: cpp-engineering/01-toolchain.md
      - 02 Docker环境: cpp-engineering/02-docker.md
      - 03 Jenkins主节点: cpp-engineering/03-jenkins-master.md
      - 04 三平台从节点: cpp-engineering/04-jenkins-agents.md
      - 05 最小CMake工程: cpp-engineering/05-min-cmake.md
      - 06 CMake并发编译: cpp-engineering/06-parallel.md
      - 07 多平台并行构建: cpp-engineering/07-matrix.md
      - 08 依赖缓存与增量: cpp-engineering/08-cache.md
      - 09 Pipeline语法: cpp-engineering/09-pipeline.md
      - 10 C++流水线实战: cpp-engineering/10-pipeline-real.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: ja
